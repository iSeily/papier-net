#
# ===========================================
# NGINX - REVERSE PROXY
# ===========================================
#
# C'est quoi Nginx ?
# → Un serveur web ultra performant
# → Ici il sert de "reverse proxy" = il reçoit les requêtes
#   et les redirige vers le bon service (frontend ou API)
#
# Pourquoi un reverse proxy ?
# → Un seul point d'entrée (port 80)
# → Sépare frontend et backend
# → Gère le HTTPS, le caching, le load balancing
# → C'est une pratique standard en production
#

# Configuration des serveurs "upstream" (backend)
# upstream = groupe de serveurs qui peuvent répondre
upstream api {
    # "api" est le nom du service dans docker-compose
    # Docker crée un réseau interne où les services se parlent par leur nom
    server api:3000;
}

server {
    # Écoute sur le port 80 (HTTP standard)
    listen 80;

    # Nom de domaine (localhost pour le dev)
    server_name localhost;

    # === FRONTEND ===
    # Toutes les requêtes vont ici par défaut
    location / {
        # Dossier où sont les fichiers statiques (HTML, CSS, JS)
        root /usr/share/nginx/html;

        # Fichier par défaut
        index index.html;

        # Si le fichier n'existe pas, renvoie index.html
        # (utile pour les Single Page Applications)
        try_files $uri $uri/ /index.html;
    }

    # === API ===
    # Toutes les requêtes qui commencent par /api ou /health
    # sont redirigées vers le backend Node.js

    location /api {
        # proxy_pass = redirige vers le serveur backend
        proxy_pass http://api;

        # Headers importants pour que le backend sache d'où vient la requête
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeout (évite les erreurs 504 sur les requêtes longues)
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # === LOGS ===
    # Les logs sont importants pour le debugging et le monitoring
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
