#
# ===========================================
# SECURITY SCANNING
# ===========================================
#
# Pourquoi scanner la sécurité ?
# → Détecter les vulnérabilités AVANT la production
# → Vérifier que les dépendances n'ont pas de failles connues
# → C'est une pratique DevSecOps standard
#

name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    # Tous les lundis à 9h (cron expression)
    - cron: '0 9 * * 1'

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Audit des dépendances npm
      - name: NPM Audit
        working-directory: app/api
        run: npm audit --audit-level=high
        continue-on-error: true  # Ne bloque pas le pipeline

      # Scan des images Docker avec Trivy
      - name: Build image for scanning
        run: docker build -f docker/Dockerfile.api -t papier-api:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'papier-api:scan'
          format: 'table'
          exit-code: '0'  # Ne bloque pas (mettre '1' en prod)
          severity: 'CRITICAL,HIGH'
