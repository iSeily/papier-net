#
# ===========================================
# GITHUB ACTIONS - CI/CD PIPELINE
# ===========================================
#
# C'est quoi CI/CD ?
# - CI (Continuous Integration) = tester automatiquement à chaque push
# - CD (Continuous Deployment) = déployer automatiquement si les tests passent
#
# Ce fichier décrit QUAND et COMMENT exécuter le pipeline
#
# Concepts clés :
# - workflow = le pipeline entier
# - job = une tâche (peut tourner en parallèle)
# - step = une étape dans un job
# - action = un script réutilisable (ex: checkout, setup-node)
#

name: CI/CD Pipeline

# ===========================================
# DÉCLENCHEURS
# ===========================================
# Quand est-ce que le pipeline se lance ?
on:
  # À chaque push sur main ou develop
  push:
    branches: [main, develop]

  # À chaque Pull Request vers main
  pull_request:
    branches: [main]

  # Possibilité de lancer manuellement depuis GitHub
  workflow_dispatch:

# ===========================================
# JOBS
# ===========================================
jobs:
  # -------------------------------------------
  # JOB 1 : TESTS
  # -------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2 : Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/api/package-lock.json

      # Étape 3 : Installer les dépendances
      - name: Install dependencies
        working-directory: app/api
        run: npm ci

      # Étape 4 : Lancer les tests
      - name: Run tests
        working-directory: app/api
        run: npm test

  # -------------------------------------------
  # JOB 2 : BUILD DOCKER
  # -------------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test  # Attend que les tests passent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build les images Docker
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t papier-api:${{ github.sha }} .

      - name: Build Nginx image
        run: docker build -f docker/Dockerfile.nginx -t papier-nginx:${{ github.sha }} .

      # Vérifier que les images sont créées
      - name: List images
        run: docker images | grep papier

  # -------------------------------------------
  # JOB 3 : DEPLOY (seulement sur main)
  # -------------------------------------------
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    # Seulement si on push sur main (pas sur les PR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurer AWS CLI
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3  # Paris

      # Déployer sur EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/papier-net
            git pull origin main
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            docker system prune -f

      # Vérifier que le déploiement a fonctionné
      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ secrets.EC2_HOST }}/health || exit 1
